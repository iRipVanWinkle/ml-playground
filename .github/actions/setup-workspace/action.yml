name: 'Setup Node.js and Workspace'
description: 'Setup Node.js, restore cache, and prepare workspace'
inputs:
    node-version:
        description: 'Node.js version to use'
        required: true
runs:
    using: 'composite'
    steps:
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
              node-version: ${{ inputs.node-version }}
              cache: 'npm'

        - name: Install dependencies
          shell: bash
          run: npm ci
